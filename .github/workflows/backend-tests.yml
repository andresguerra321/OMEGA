name: Backend Java Tests

on:
  pull_request:
    paths:
      - 'omega/backend-java/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'omega/backend-java/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: omega/backend-java/pom.xml
      - name: Run full Java test suite (including Testcontainers)
        working-directory: omega/backend-java
        run: mvn -B test
