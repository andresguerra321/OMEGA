name: Supply Chain & SBOM Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Frontend Dependencies (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omega/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: omega/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high

  python-worker-audit:
    name: Forensic Worker Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.7.3
      - run: pip-audit -r omega/api/requirements.txt
      - run: python omega/rag_engine/corpus_integrity.py

  java-sbom-and-build:
    name: Java Core Build & CycloneDX SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omega/backend-java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: mvn -B -DskipTests compile test-compile
      - run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.0:makeBom -DoutputFormat=json -DoutputName=omega-backend-sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omega-java-sbom
          path: omega/backend-java/target/omega-backend-sbom.json
          retention-days: 30

  vice-security-audit:
    name: Static Secrets & Config Audit (VICE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run VICE local audit on omega/
        env:
          VICE_ACCEPT_TERMS: '1'
        run: npx --yes vice-security@1.4.2 audit omega --ci --min-score 90
