name: Release Desktop Installers (Signatures and Provenance)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versión de etiqueta o paquete de pruebas'
        required: false
        default: 'local-ci'

permissions:
  contents: read

jobs:
  backend-security:
    name: Validate Java 21 CORS and CSRF
    uses: ./.github/workflows/backend-security.yml

  docker-images:
    name: Build bundled Linux Docker services
    needs: backend-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test resource packaging
        run: python -m unittest discover -s omega/scripts -p test_stage_desktop_resources.py
      - name: Build and export services once on a Linux Docker host
        run: python omega/scripts/stage_desktop_resources.py --with-images
      - name: Verify local account recovery against isolated services
        run: python omega/scripts/smoke_local_recovery.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omega-self-hosted-images
          path: |
            omega/frontend/src-tauri/bundle-resources/omega/desktop-images.tar
            omega/frontend/src-tauri/bundle-resources/omega/desktop-release.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  build-tauri-v2:
    needs: [backend-security, docker-images]
    name: Build OMEGA Tauri v2 + Rust Sensor (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            triple: x86_64-pc-windows-msvc
            ext: '.exe'
          - os: macos-latest
            platform: macos
            triple: aarch64-apple-darwin
            ext: ''
          - os: ubuntu-latest
            platform: linux
            triple: x86_64-unknown-linux-gnu
            ext: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: omega/frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omega-self-hosted-images
          path: ${{ runner.temp }}/omega-self-hosted-images
      - name: Use the Docker images verified for this commit
        shell: pwsh
        run: |
          "OMEGA_PREBUILT_IMAGES_DIR=$(Join-Path $env:RUNNER_TEMP 'omega-self-hosted-images')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify CTI and PDF Corpus SHA-256 Manifests
        run: python omega/rag_engine/corpus_integrity.py
      - name: Stage Self-Hosted Docker Resources (compose + service sources)
        run: python omega/scripts/stage_desktop_resources.py
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install Linux WebKitGTK Dependencies
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|http://[^ ]*ubuntu.com/ubuntu/|https://mirrors.edge.kernel.org/ubuntu/|g; s|https://[^ ]*ubuntu.com/ubuntu/|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test and Build Native Rust Sensor (omega-sensor)
        working-directory: omega/sensor-rust
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Stage Rust Sensor Sidecar
        env:
          MATRIX_EXT: ${{ matrix.ext }}
          MATRIX_TRIPLE: ${{ matrix.triple }}
        shell: pwsh
        run: |
          $binDir = 'omega/frontend/src-tauri/binaries'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $src = "omega/sensor-rust/target/release/omega-sensor$($env:MATRIX_EXT)"
          $dst = "$binDir/omega-sensor-$($env:MATRIX_TRIPLE)$($env:MATRIX_EXT)"
          Copy-Item -Force $src $dst
      - name: Test Tauri v2 Rust Shell (including PDF Vault Index)
        working-directory: omega/frontend/src-tauri
        run: cargo test --locked
      - name: Install Frontend Dependencies and Build Tauri v2 Bundle
        working-directory: omega/frontend
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test
          npx @tauri-apps/cli@2 build
      - name: Upload Tauri v2 Installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omega-desktop-tauri-${{ matrix.platform }}
          path: |
            omega/frontend/src-tauri/target/release/bundle/nsis/*.exe
            omega/frontend/src-tauri/target/release/bundle/msi/*.msi
            omega/frontend/src-tauri/target/release/bundle/dmg/*.dmg
            omega/frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            omega/frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 90

  release-integrity:
    name: Verify, Sign and Attest Consolidated Installers
    needs: build-tauri-v2
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: omega-desktop-tauri-*
          path: installer-input
      - name: Generate Mandatory Checksums and Optional Detached Signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python omega/scripts/release_integrity.py --source installer-input --output release --recursive
      - name: Package Official OMEGA Visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          output = Path('release')
          with (output / 'MEDIA_SHA256SUMS.txt').open('w', encoding='utf-8', newline='\n') as manifest:
              for name in ('omega-v2-release-banner.jpg', 'omega-v2-0-1-showcase.jpg', 'omega-v2-0-1-shield-pillars.jpg'):
                  source = Path('docs/assets') / name
                  target = output / name
                  shutil.copy2(source, target)
                  manifest.write(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {name}\n')
          PY
      - name: Attest Build Provenance (Sigstore / SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/*'
      - name: Upload Verifiable Release Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omega-desktop-release
          path: release/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName })
          $notesFile = Join-Path '.github/release-notes' ($tag + '.md')
          if (-not (Test-Path -LiteralPath $notesFile)) {
            $notesFile = Join-Path $env:RUNNER_TEMP 'omega-release-notes.md'
            @(
              'Instaladores nativos OMEGA Tauri v2 + Sensor Rust para Windows, macOS y Linux.'
              ''
              'Comprueba SHA256SUMS.txt y la atestación de procedencia. Si hay firma separada, verifica SHA256SUMS.txt.sig con una clave pública obtenida por un canal confiable.'
              ''
              'Authenticode, Developer ID y notarización dependen de los certificados configurados. Consulta los logs de empaquetado; los builds de pruebas pueden carecer de firma comercial.'
            ) | Set-Content -LiteralPath $notesFile -Encoding utf8
          }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "OMEGA $tag" --notes-file $notesFile --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag" }
