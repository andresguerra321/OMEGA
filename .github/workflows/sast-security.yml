name: SAST Security Analysis (CodeQL & Semgrep)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Escaneo semanal los lunes a las 04:00 UTC para recoger nuevas consultas/reglas
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      enforcement_mode:
        description: 'Modo de control Semgrep: enforce-new-error (por defecto), enforce-all-error u observe'
        required: false
        default: 'enforce-new-error'
        type: choice
        options:
          - enforce-new-error
          - enforce-all-error
          - observe

permissions:
  contents: read

concurrency:
  group: sast-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (for Java CodeQL manual build)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Java backend for CodeQL semantic analysis
        if: matrix.language == 'java-kotlin'
        working-directory: omega/backend-java
        run: mvn -B -DskipTests compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'never' || 'always' }}

  semgrep:
    name: Semgrep SAST (OWASP + OMEGA Rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      ENFORCEMENT_MODE: ${{ inputs.enforcement_mode || 'enforce-new-error' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for Semgrep CLI
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          # Semgrep 1.99's OpenTelemetry dependency still imports pkg_resources.
          python -m pip install setuptools==80.9.0 semgrep==1.99.0
          semgrep --version

      - name: Run Semgrep SAST scan (SARIF + JSON)
        id: semgrep_scan
        run: |
          set -o pipefail
          SEMGREP_RC=0
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/java \
            --config p/python \
            --config p/javascript \
            --config p/react \
            --config p/rust \
            --config p/dockerfile \
            --config .semgrep/omega-rules.yml \
            --metrics=off \
            --sarif-output=omega-semgrep.sarif \
            --json-output=omega-semgrep.json \
            --severity WARNING \
            --severity ERROR \
            omega/ .github/workflows/ || SEMGREP_RC=$?

          echo "exit_code=${SEMGREP_RC}" >> "$GITHUB_OUTPUT"

          # Fallar inmediatamente si Semgrep tuvo un error de ejecución (exit code >= 2)
          if [ "${SEMGREP_RC}" -ge 2 ]; then
            echo "::error::Semgrep falló con código de error técnico (${SEMGREP_RC})."
            exit "${SEMGREP_RC}"
          fi
          if [ ! -s omega-semgrep.json ] || [ ! -s omega-semgrep.sarif ]; then
            echo "::error::Semgrep no generó los reportes JSON y SARIF; el escaneo no se considera completado."
            exit 2
          fi

      - name: Run Semgrep Gate Evaluator Unit Tests
        run: |
          python -m pip install --quiet pytest==8.3.4
          python -m pytest .github/scripts/test_evaluate_semgrep_gate.py -v

      - name: Evaluate Semgrep Security Gate (Baseline + Accepted Risks)
        id: evaluate_gate
        env:
          SEMGREP_SCAN_EXIT_CODE: ${{ steps.semgrep_scan.outputs.exit_code }}
        run: |
          python .github/scripts/evaluate_semgrep_gate.py \
            --report omega-semgrep.json \
            --sarif omega-semgrep.sarif \
            --exit-code "${SEMGREP_SCAN_EXIT_CODE}" \
            --accepted-risks .github/security/semgrep-accepted-risks.json \
            --baseline .github/security/semgrep-baseline.json \
            --mode "${ENFORCEMENT_MODE}"

      - name: Upload Semgrep SARIF to GitHub Code Scanning
        if: always() && hashFiles('omega-semgrep.sarif') != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: omega-semgrep.sarif
          category: semgrep-omega

      - name: Upload Semgrep Reports as Artifact
        if: always() && hashFiles('omega-semgrep.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omega-semgrep-sast-report
          path: |
            omega-semgrep.sarif
            omega-semgrep.json
          retention-days: 30
