name: Forensic Worker API Tests

on:
  pull_request:
    paths:
      - 'omega/api/**'
      - 'omega/rag_engine/**'
      - 'omega/cli/**'
      - '.github/workflows/api-worker-tests.yml'
  push:
    branches: [main]
    paths:
      - 'omega/api/**'
      - 'omega/rag_engine/**'
      - 'omega/cli/**'
      - '.github/workflows/api-worker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-omega-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: omega/api/requirements-test.txt
      - name: Install omega/api test dependencies
        working-directory: omega/api
        run: |
          python -m pip install -r requirements-test.txt pytest==8.3.4
      - name: Run omega/api pytest suite
        working-directory: omega/api
        run: python -m pytest tests -q
      - name: Run omega/rag_engine pytest suite
        working-directory: omega/rag_engine
        run: python -m pytest -q
      - name: Run omega/cli pytest suite
        working-directory: omega/cli
        run: python -m pytest -q
