name: Backend CORS and CSRF

on:
  pull_request:
    paths:
      - 'omega/backend-java/**'
      - '.github/workflows/backend-security.yml'
  push:
    branches: [main]
    paths:
      - 'omega/backend-java/**'
      - '.github/workflows/backend-security.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: omega/backend-java/pom.xml
      - name: Test CORS and CSRF through the security filter chain
        working-directory: omega/backend-java
        run: mvn -B -Dtest=CorsConfigurationTest,CsrfSecurityTest,AccountRecoveryTest,LocalWorkspaceAccessTest,LoginRateLimiterTest test
