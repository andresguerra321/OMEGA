version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "docker"
    directory: "/omega/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "docker"
