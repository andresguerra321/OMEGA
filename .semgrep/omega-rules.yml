rules:
  - id: omega-python-unsafe-tar-extractall
    languages: [python]
    severity: ERROR
    message: >
      Uso de tarfile.extractall() sin extracción controlada miembro por miembro.
      En OMEGA (sysdiagnose y backups móviles) todos los archivos .tar.gz deben
      extraerse validando path traversal (Zip-Slip), symlinks y tamaño máximo.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control"
      confidence: HIGH
    pattern: $TF.extractall(...)

  - id: omega-python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >
      Invocación de subprocess con shell=True detectada. Utiliza listas de
      argumentos con shell=False para prevenir inyección de comandos en el worker forense.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: omega-frontend-dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Uso de dangerouslySetInnerHTML detectado en React. Renderiza Markdown/texto
      mediante react-markdown + DOMPurify para evitar XSS en el shell desktop.
    metadata:
      category: security
      cwe: "CWE-79: Cross-Site Scripting (XSS)"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
    pattern: |
      <$EL dangerouslySetInnerHTML={...} />

  - id: omega-frontend-jwt-in-localstorage
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Escritura de token/JWT en localStorage detectada. La política de OMEGA exige
      sesiones respaldadas por cookies HttpOnly/SameSite=Strict sin tokens en localStorage.
    metadata:
      category: security
      cwe: "CWE-922: Insecure Storage of Sensitive Information"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
    pattern-either:
      - pattern: localStorage.setItem("jwt", ...)
      - pattern: localStorage.setItem("token", ...)
      - pattern: localStorage.setItem("access_token", ...)
      - pattern: localStorage.setItem("omega_jwt", ...)

  - id: omega-java-native-query-concat
    languages: [java]
    severity: ERROR
    message: >
      Posible concatenación dinámica en consulta SQL nativa. Usa parámetros
      enlazados (:param o ?) para prevenir SQL Injection en el backend multi-tenant.
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
    pattern-either:
      - pattern: $EM.createNativeQuery($A + $B, ...)
      - pattern: $JDBC.query($A + $B, ...)
      - pattern: $JDBC.update($A + $B, ...)

  - id: omega-rust-unsafe-block
    languages: [rust]
    severity: WARNING
    message: >
      Bloque `unsafe` detectado en Rust (sensor o shell Tauri). Documenta el
      invariante de seguridad de memoria y revisa si existe alternativa segura.
    metadata:
      category: security
      cwe: "CWE-119: Improper Restriction of Operations within the Bounds of a Memory Buffer"
      confidence: MEDIUM
    pattern: |
      unsafe { ... }
