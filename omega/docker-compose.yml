services:
  # 1. PostgreSQL 16 + pgvector + tsvector híbrido (aislado en red privada)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omega_postgres
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - omega_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      omega-private:
        aliases:
          - omega-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omega_admin} -d ${POSTGRES_DB:-omega_cti}"]
      interval: 5s
      timeout: 5s
      retries: 6

  # 2. Microservicio Forense Stateless (In-RAM Only, sin puertos públicos y protegido por X-Internal-Service-Token)
  forensic-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: omega_forensic_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-omega-dev-internal-service-token-change-in-prod}
    expose:
      - "8000"
    networks:
      omega-private:
        aliases:
          - omega-api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'X-Internal-Service-Token': os.environ['INTERNAL_SERVICE_TOKEN']}); urllib.request.urlopen(req, timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # 3. Core Transaccional, Seguridad Multi-Tenant, OCR Zero-Retention y Motor RAG Híbrido (Java 21 / Spring Boot)
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: omega_backend_java
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-omega_cti}?currentSchema=omega_rag,public
      POSTGRES_USER: ${POSTGRES_USER:-omega_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omega_dev_secret}
      OMEGA_JWT_SECRET: ${OMEGA_JWT_SECRET:-omega-dev-local-only-hmac-sha256-secret-key-2026-change-in-prod}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-omega-dev-internal-service-token-change-in-prod}
      OMEGA_INGEST_TMP_DIR: /tmp/omega_ingest
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/4.00/tessdata
      OMEGA_FORENSIC_WORKER_URL: http://forensic-worker:8000
      OMEGA_EMBEDDING_MODEL: ${OMEGA_EMBEDDING_MODEL:-text-embedding-3-small}
      OMEGA_STIX_CORPUS_DIR: /app/corpus_mvp/iocs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${JAVA_BACKEND_PORT:-8080}:8080"
    # Directorio temporal volátil estrictamente en RAM sin ejecución (Zero-Retention; uid=10001 = usuario no-root omega)
    tmpfs:
      - /tmp/omega_ingest:rw,noexec,nosuid,nodev,size=512m,mode=0700,uid=10001,gid=10001
    volumes:
      - ./corpus_mvp/iocs:/app/corpus_mvp/iocs:ro
    networks:
      - omega-public
      - omega-private
    depends_on:
      postgres:
        condition: service_healthy
      forensic-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  omega-public:
    driver: bridge
  omega-private:
    driver: bridge
    internal: true

volumes:
  omega_pgdata:
