x-omega-labels: &omega-labels
  io.omega.managed: "true"

services:
  # 1. PostgreSQL 16 + pgvector + tsvector híbrido (aislado en red privada)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omega_postgres
    labels: *omega-labels
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omega_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omega_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-omega_cti}
    expose:
      - "5432"
    volumes:
      - omega_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      omega-private:
        aliases:
          - omega-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omega_admin} -d ${POSTGRES_DB:-omega_cti}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # 2. Microservicio Forense Stateless (In-RAM Only, sin puertos públicos y protegido por X-Internal-Service-Token)
  forensic-worker:
    image: omega-forensic-worker:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: omega_forensic_worker
    labels:
      <<: *omega-labels
      io.omega.version: ${OMEGA_DESKTOP_VERSION:-development}
      io.omega.release: ${OMEGA_DESKTOP_RELEASE_ID:-development}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-omega_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omega_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-omega_cti}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Define un secreto efimero en RAM para iniciar los servicios}
      OMEGA_REQUIRE_HMAC: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OMEGA_STIX_MANIFEST_PATH: /app/corpus_mvp/iocs/stix_manifest.json
    volumes:
      - ./corpus_mvp/iocs:/app/corpus_mvp/iocs:ro
      - ./corpus_mvp/pdfs:/app/corpus_mvp/pdfs:ro
      - ./corpus_mvp/corpus_manifest.json:/app/corpus_mvp/corpus_manifest.json:ro
    expose:
      - "8000"
    networks:
      omega-private:
        aliases:
          - omega-api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "healthcheck.py",
        ]
      interval: 3s
      timeout: 4s
      retries: 15
      start_period: 2s

  # 3. Core Transaccional, Seguridad Multi-Tenant, OCR Zero-Retention y Motor RAG Híbrido (Java 21 / Spring Boot)
  backend-java:
    image: omega-backend-java:latest
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: omega_backend_java
    labels:
      <<: *omega-labels
      io.omega.version: ${OMEGA_DESKTOP_VERSION:-development}
      io.omega.release: ${OMEGA_DESKTOP_RELEASE_ID:-development}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-omega_cti}?currentSchema=omega_rag,public
      POSTGRES_USER: ${POSTGRES_USER:-omega_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omega_dev_secret}
      OMEGA_JWT_SECRET: ${OMEGA_JWT_SECRET:-omega-dev-local-only-hmac-sha256-secret-key-2026-change-in-prod}
      OMEGA_COOKIE_SECURE: ${OMEGA_COOKIE_SECURE:-false}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Define un secreto efimero en RAM para iniciar los servicios}
      OMEGA_REQUIRE_HMAC: "true"
      OMEGA_INGEST_TMP_DIR: /tmp/omega_ingest
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/4.00/tessdata
      OMEGA_FORENSIC_WORKER_URL: http://forensic-worker:8000
      OMEGA_HOST_WORKER_URL: ${OMEGA_HOST_WORKER_URL:-http://forensic-worker:8000}
      OMEGA_HOST_INTERNAL_SERVICE_TOKEN: ${OMEGA_HOST_INTERNAL_SERVICE_TOKEN:-${INTERNAL_SERVICE_TOKEN:?Define un secreto efimero en RAM para iniciar los servicios}}
      OMEGA_HOST_OWNER_TENANT_ID: ${OMEGA_HOST_OWNER_TENANT_ID:-}
      OMEGA_EMBEDDING_MODEL: ${OMEGA_EMBEDDING_MODEL:-text-embedding-3-small}
      OMEGA_AI_PROVIDER: ${OMEGA_AI_PROVIDER:-openai}
      OMEGA_OLLAMA_BASE_URL: ${OMEGA_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OMEGA_OLLAMA_EMBED_MODEL: ${OMEGA_OLLAMA_EMBED_MODEL:-bge-m3}
      OMEGA_OLLAMA_CHAT_MODEL: ${OMEGA_OLLAMA_CHAT_MODEL:-qwen2.5:14b}
      OMEGA_OLLAMA_VISION_MODEL: ${OMEGA_OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      OMEGA_STIX_CORPUS_DIR: /app/corpus_mvp/iocs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-auto}
      CUSTOM_LLM_PROVIDER: ${CUSTOM_LLM_PROVIDER:-}
      CUSTOM_LLM_BASE_URL: ${CUSTOM_LLM_BASE_URL:-}
      CUSTOM_LLM_API_KEY: ${CUSTOM_LLM_API_KEY:-}
      CUSTOM_LLM_MODEL: ${CUSTOM_LLM_MODEL:-}
      OMEGA_BOOTSTRAP_SECRET: ${OMEGA_BOOTSTRAP_SECRET:-}
      OMEGA_SMTP_HOST: ${OMEGA_SMTP_HOST:-}
      OMEGA_SMTP_PORT: ${OMEGA_SMTP_PORT:-587}
      OMEGA_SMTP_USERNAME: ${OMEGA_SMTP_USERNAME:-}
      OMEGA_SMTP_PASSWORD: ${OMEGA_SMTP_PASSWORD:-}
      OMEGA_SMTP_FROM: ${OMEGA_SMTP_FROM:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      OMEGA_EXTERNAL_IOC_SYNC_ENABLED: ${OMEGA_EXTERNAL_IOC_SYNC_ENABLED:-true}
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${JAVA_BACKEND_PORT:-8080}:8080"
    # Directorio temporal volátil estrictamente en RAM sin ejecución (Zero-Retention; uid=10001 = usuario no-root omega)
    tmpfs:
      - /tmp/omega_ingest:rw,noexec,nosuid,nodev,size=512m,mode=0700,uid=10001,gid=10001
    volumes:
      - ./corpus_mvp/iocs:/app/corpus_mvp/iocs:ro
      - ./corpus_mvp/pdfs:/app/corpus_mvp/pdfs:ro
      - ./corpus_mvp/corpus_manifest.json:/app/corpus_mvp/corpus_manifest.json:ro
    networks:
      - omega-public
      - omega-private
    depends_on:
      postgres:
        condition: service_healthy
      forensic-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 10s

  # 4. Frontend React + Proxy Nginx apuntando exclusivamente al gateway backend-java en omega-public
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omega_frontend
    labels: *omega-labels
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - omega-public
    depends_on:
      backend-java:
        condition: service_healthy

  # 5. Router Multi-Proveedor LLM Opcional (OmniRoute: fallback/cuotas/auto-routing en http://127.0.0.1:20128/dashboard)
  omniroute:
    profiles: ["omniroute"]
    image: ghcr.io/diegosouzapw/omniroute:latest
    container_name: omega_omniroute
    labels: *omega-labels
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNIROUTE_PORT:-20128}:20128"
    environment:
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "production"
    volumes:
      - omniroute_data:/app/data
    networks:
      - omega-public
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:20128/api/monitoring/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

networks:
  omega-public:
    driver: bridge
  omega-private:
    driver: bridge
    internal: true

volumes:
  omega_pgdata:
    name: ${OMEGA_PG_VOLUME_NAME:-${COMPOSE_PROJECT_NAME:-omega}_omega_pgdata}
  omniroute_data:
