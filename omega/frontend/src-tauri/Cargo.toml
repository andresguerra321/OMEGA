[package]
name = "omega-desktop-tauri"
version = "2.0.9"
description = "OMEGA Security Desktop Shell (Tauri v2)"
authors = ["OMEGA Security"]
edition = "2021"

[lib]
name = "omega_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
getrandom = "0.3"
