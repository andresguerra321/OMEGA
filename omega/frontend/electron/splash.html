<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMEGA — Iniciando</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --text: #f2f2f4;
        --muted: #8a8b94;
        --accent: #2f6fed;
        --ok: #30d158;
        --err: #ff453a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000000;
        color: var(--text);
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        user-select: none;
      }

      .titlebar-drag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        -webkit-app-region: drag;
        z-index: 20;
      }

      .stage {
        height: 100%;
        width: 100%;
        padding: 36px 24px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      .eclipse-wrap {
        position: relative;
        width: 380px;
        height: 380px;
        max-width: 78vmin;
        max-height: 78vmin;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: stageEnter 550ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #eclipseCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      @keyframes stageEnter {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .status-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        max-width: 460px;
      }

      .wordmark {
        font-family: 'Sora', 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.44em;
        padding-left: 0.44em;
        color: rgba(242, 242, 244, 0.92);
        margin: 0;
      }

      .headline {
        margin: 0;
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .subtitle {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(138, 139, 148, 0.72);
        min-height: 18px;
      }

      .svc-pills {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-top: 2px;
      }

      .svc-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(154, 154, 162, 0.7);
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        transition: background-color 220ms ease, box-shadow 220ms ease;
      }

      .svc-pill.starting .dot {
        background: #9cc0ff;
        box-shadow: 0 0 8px rgba(156, 192, 255, 0.8);
      }

      .svc-pill.starting {
        color: rgba(242, 242, 244, 0.9);
      }

      .svc-pill.healthy .dot {
        background: var(--ok);
        box-shadow: 0 0 8px rgba(48, 209, 88, 0.75);
      }

      .svc-pill.healthy {
        color: rgba(242, 242, 244, 0.92);
      }

      .svc-pill.error .dot {
        background: var(--err);
        box-shadow: 0 0 8px rgba(255, 69, 58, 0.85);
      }

      .svc-pill.error {
        color: #fca5a5;
      }

      .log-strip {
        margin-top: 2px;
        max-width: 440px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 10.5px;
        color: rgba(154, 154, 162, 0.6);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hidden {
        display: none !important;
      }

      .error-box {
        width: 100%;
        max-width: 500px;
        margin-top: 4px;
        padding: 16px 18px;
        border-radius: 14px;
        background: rgba(20, 12, 14, 0.82);
        border: 1px solid rgba(255, 69, 58, 0.34);
        backdrop-filter: blur(14px);
      }

      .error-detail {
        margin: 0 0 12px;
        font-size: 12.5px;
        line-height: 1.5;
        color: #fecaca;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .prod-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }

      .prod-toggle input {
        accent-color: var(--accent);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 500;
        border-radius: 9px;
        padding: 8px 14px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background-color 140ms ease, filter 140ms ease;
      }

      .btn-primary {
        background: var(--accent);
        color: #ffffff;
      }

      .btn-primary:hover {
        filter: brightness(1.1);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.14);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .footer-note {
        position: fixed;
        bottom: 14px;
        left: 24px;
        right: 24px;
        text-align: center;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: rgba(138, 139, 148, 0.42);
      }

      @media (prefers-reduced-motion: reduce) {
        .eclipse-wrap {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar-drag"></div>
    <main class="stage" id="stageRoot" aria-live="polite">
      <div class="eclipse-wrap" aria-hidden="true">
        <canvas id="eclipseCanvas"></canvas>
      </div>

      <div class="status-block">
        <p class="wordmark">OMEGA</p>
        <h1 class="headline" id="headline">Iniciando servicios de OMEGA…</h1>
        <p class="subtitle" id="subtitle">Verificando entorno local y contenedores</p>

        <div class="svc-pills" id="servicesList">
          <span class="svc-pill" id="badge-postgres" title="PostgreSQL 16 + pgvector">
            <span class="dot" aria-hidden="true"></span>
            <span>DB</span>
          </span>
          <span class="svc-pill" id="badge-forensic-worker" title="Forensic Worker (FastAPI)">
            <span class="dot" aria-hidden="true"></span>
            <span>Worker</span>
          </span>
          <span class="svc-pill" id="badge-backend-java" title="OMEGA Core Gateway (Java 21)">
            <span class="dot" aria-hidden="true"></span>
            <span>Gateway</span>
          </span>
        </div>

        <div class="log-strip hidden" id="logStrip"></div>
      </div>

      <div class="error-box hidden" id="errorBox">
        <p class="error-detail" id="errorDetail"></p>
        <label class="prod-toggle">
          <input type="checkbox" id="prodModeCheckbox" />
          <span>Arrancar con override fail-closed (<code>docker-compose.prod.yml</code>)</span>
        </label>
        <div class="actions">
          <button type="button" class="btn-primary" id="retryBtn">Reintentar arranque</button>
          <button type="button" class="btn-secondary" id="skipBtn">Abrir sin backend (diagnóstico)</button>
        </div>
      </div>
    </main>

    <div class="footer-note" id="ownershipNote">Red aislada · Volúmenes persistentes protegidos</div>

    <script>
      (function startEclipseCanvas() {
        const canvas = document.getElementById('eclipseCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const prefersReduced =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const stars = Array.from({ length: 16 }, (_, idx) => ({
          angle: idx * 2.39996,
          distFrac: 0.72 + ((idx * 17) % 44) / 100,
          speed: 0.04 + ((idx % 4) * 0.015),
          size: 0.7 + (idx % 3) * 0.35,
          alpha: 0.25 + ((idx % 5) * 0.12),
        }));

        function drawConicTrailRing(cx, cy, radius, lineWidth, startAngle, maxAlpha) {
          ctx.save();
          ctx.lineWidth = lineWidth;
          if (typeof ctx.createConicGradient === 'function') {
            const grad = ctx.createConicGradient(startAngle, cx, cy);
            grad.addColorStop(0.0, `rgba(255, 255, 255, ${maxAlpha})`);
            grad.addColorStop(0.22, `rgba(235, 240, 250, ${maxAlpha * 0.55})`);
            grad.addColorStop(0.55, `rgba(210, 220, 238, ${maxAlpha * 0.12})`);
            grad.addColorStop(0.85, 'rgba(255, 255, 255, 0)');
            grad.addColorStop(1.0, `rgba(255, 255, 255, ${maxAlpha * 0.85})`);
            ctx.strokeStyle = grad;
          } else {
            ctx.strokeStyle = `rgba(255, 255, 255, ${maxAlpha * 0.45})`;
          }
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        function drawFrame(tSec) {
          const rect = canvas.getBoundingClientRect();
          const cssSize = Math.max(180, Math.min(rect.width || 380, rect.height || 380));
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const targetPx = Math.round(cssSize * dpr);
          if (canvas.width !== targetPx || canvas.height !== targetPx) {
            canvas.width = targetPx;
            canvas.height = targetPx;
          }

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, cssSize, cssSize);

          const cx = cssSize / 2;
          const cy = cssSize / 2;
          const R = cssSize * 0.43;
          const eclipseAngle = 2.4 + tSec * 0.62;

          // 1. Halo ambiental suave
          const ambient = ctx.createRadialGradient(cx, cy, R * 0.18, cx, cy, R * 1.12);
          ambient.addColorStop(0, 'rgba(255, 255, 255, 0.14)');
          ambient.addColorStop(0.45, 'rgba(225, 232, 244, 0.05)');
          ambient.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = ambient;
          ctx.beginPath();
          ctx.arc(cx, cy, R * 1.12, 0, Math.PI * 2);
          ctx.fill();

          // 2. Bandas orbitales difuminadas con estela cónica
          drawConicTrailRing(cx, cy, R * 0.92, R * 0.11, -tSec * 0.32 + 0.9, 0.13);
          drawConicTrailRing(cx, cy, R * 0.78, R * 0.065, tSec * 0.48 + 2.2, 0.24);
          drawConicTrailRing(cx, cy, R * 0.64, R * 0.035, -tSec * 0.65 + 4.1, 0.30);

          // Anillos nítidos finos superpuestos
          ctx.save();
          ctx.lineWidth = 0.9;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.beginPath();
          ctx.arc(cx, cy, R * 0.78, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.beginPath();
          ctx.arc(cx, cy, R * 0.64, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          // Cometas luminosos en órbitas
          const comets = [
            { r: R * 0.78, a: tSec * 0.62 + 1.4, span: 0.18, w: 2.0, alpha: 0.9 },
            { r: R * 0.92, a: -tSec * 0.38 + 4.3, span: 0.11, w: 1.5, alpha: 0.75 },
          ];
          comets.forEach((c) => {
            ctx.save();
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.85)';
            ctx.shadowBlur = 7;
            ctx.strokeStyle = `rgba(255, 255, 255, ${c.alpha})`;
            ctx.lineWidth = c.w;
            ctx.beginPath();
            ctx.arc(cx, cy, c.r, c.a, c.a + c.span);
            ctx.stroke();
            ctx.restore();
          });

          // 3. Corona vórtice de partículas en espiral (34 brazos x 5 niveles)
          const arms = 34;
          const rings = 5;
          const spinOffset = tSec * 0.16;
          for (let i = 0; i < arms; i++) {
            const baseA = (i / arms) * Math.PI * 2 + spinOffset;
            for (let j = 0; j < rings; j++) {
              const frac = j / (rings - 1);
              const r = R * (0.335 + frac * 0.27);
              const a = baseA + frac * 0.38;
              const px = cx + Math.cos(a) * r;
              const py = cy + Math.sin(a) * r;
              const align = Math.cos(a - eclipseAngle);
              const radialFade = 1 - frac * 0.55;
              const alpha = Math.max(0.06, Math.min(0.88, (0.36 + 0.34 * align) * radialFade));
              const dotR = j === 0 ? 1.15 : 0.95;
              ctx.fillStyle = `rgba(244, 246, 252, ${alpha.toFixed(3)})`;
              ctx.beginPath();
              ctx.arc(px, py, dotR, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // 4. Micro-partículas flotantes externas
          stars.forEach((s) => {
            const a = s.angle + tSec * s.speed;
            const r = R * s.distFrac;
            const px = cx + Math.cos(a) * r;
            const py = cy + Math.sin(a) * r;
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
            ctx.beginPath();
            ctx.arc(px, py, s.size, 0, Math.PI * 2);
            ctx.fill();
          });

          // 5. Disco central Eclipse + creciente blanco orbital
          const coreR = R * 0.275;
          const gx = cx + Math.cos(eclipseAngle) * (coreR * 0.14);
          const gy = cy + Math.sin(eclipseAngle) * (coreR * 0.14);
          const rimGlow = ctx.createRadialGradient(gx, gy, coreR * 0.72, gx, gy, coreR * 1.48);
          rimGlow.addColorStop(0, 'rgba(255, 255, 255, 0.34)');
          rimGlow.addColorStop(0.55, 'rgba(232, 238, 248, 0.10)');
          rimGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = rimGlow;
          ctx.beginPath();
          ctx.arc(cx, cy, coreR * 1.48, 0, Math.PI * 2);
          ctx.fill();

          // Centro negro puro
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
          ctx.fill();

          // Aro sutil completo del eclipse
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
          ctx.stroke();

          // Creciente luminoso exterior rotatorio
          ctx.save();
          ctx.lineCap = 'round';
          ctx.shadowColor = 'rgba(255, 255, 255, 0.95)';
          ctx.shadowBlur = 12;
          const arcSpan = Math.PI * 0.92;
          const arcGrad = ctx.createRadialGradient(
            cx + Math.cos(eclipseAngle) * coreR,
            cy + Math.sin(eclipseAngle) * coreR,
            2,
            cx,
            cy,
            coreR * 1.15,
          );
          arcGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          arcGrad.addColorStop(0.65, 'rgba(242, 245, 252, 0.55)');
          arcGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.strokeStyle = arcGrad;
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.arc(cx, cy, coreR, eclipseAngle - arcSpan / 2, eclipseAngle + arcSpan / 2);
          ctx.stroke();
          ctx.restore();
        }

        if (prefersReduced) {
          drawFrame(0);
          return;
        }

        const start = performance.now();
        function loop(now) {
          drawFrame((now - start) / 1000);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();

      const headlineEl = document.getElementById('headline');
      const subtitleEl = document.getElementById('subtitle');
      const logStripEl = document.getElementById('logStrip');
      const errorBoxEl = document.getElementById('errorBox');
      const errorDetailEl = document.getElementById('errorDetail');
      const prodCheckboxEl = document.getElementById('prodModeCheckbox');
      const retryBtn = document.getElementById('retryBtn');
      const skipBtn = document.getElementById('skipBtn');
      const servicesListEl = document.getElementById('servicesList');
      const ownershipNoteEl = document.getElementById('ownershipNote');

      const params = new URLSearchParams(window.location.search);
      const isClosingView = params.get('mode') === 'closing';

      function pillClassFor(svcState) {
        if (!svcState) return 'svc-pill';
        if (svcState.healthy) return 'svc-pill healthy';
        if (
          svcState.health === 'unhealthy' ||
          svcState.state === 'exited' ||
          svcState.state === 'dead' ||
          svcState.state === 'restarting'
        ) {
          return 'svc-pill error';
        }
        if (svcState.running || svcState.state === 'created') {
          return 'svc-pill starting';
        }
        return 'svc-pill';
      }

      function renderState(state) {
        if (!state || isClosingView) return;

        headlineEl.textContent = state.message || 'Iniciando servicios de OMEGA…';
        subtitleEl.textContent = state.detail || '';

        if (typeof state.prodMode === 'boolean') {
          prodCheckboxEl.checked = state.prodMode;
        }

        if (state.phase === 'error') {
          errorBoxEl.classList.remove('hidden');
          errorDetailEl.textContent = state.detail || 'No se pudieron iniciar los servicios locales.';
        } else {
          errorBoxEl.classList.add('hidden');
        }

        for (const svcName of ['postgres', 'forensic-worker', 'backend-java']) {
          const el = document.getElementById(`badge-${svcName}`);
          if (!el) continue;
          el.className = pillClassFor(state.services?.[svcName]);
        }

        const lastLog =
          Array.isArray(state.logLines) && state.logLines.length > 0
            ? state.logLines[state.logLines.length - 1]
            : '';
        if (lastLog && state.phase !== 'ready') {
          logStripEl.textContent = lastLog;
          logStripEl.classList.remove('hidden');
        } else {
          logStripEl.classList.add('hidden');
        }

        ownershipNoteEl.textContent = state.startedByElectron
          ? 'Ciclo automático activo · Volúmenes protegidos (omega_pgdata)'
          : 'Conectando con entorno local · Red aislada OMEGA';
      }

      if (isClosingView) {
        headlineEl.textContent = 'Deteniendo contenedores de OMEGA…';
        subtitleEl.textContent = 'Cierre limpio sin alterar tus datos persistentes';
        servicesListEl.classList.add('hidden');
        logStripEl.classList.add('hidden');
        errorBoxEl.classList.add('hidden');
        ownershipNoteEl.textContent = 'Conservando volumen omega_pgdata';
      } else if (window.omegaDesktop) {
        const bridge = window.omegaDesktop;
        if (typeof bridge.getBackendStatus === 'function') {
          bridge.getBackendStatus().then(renderState).catch(() => {});
        }
        if (typeof bridge.onBackendStatus === 'function') {
          bridge.onBackendStatus(renderState);
        }
        retryBtn.addEventListener('click', () => {
          errorBoxEl.classList.add('hidden');
          bridge.retryBackendStartup?.({ prodMode: Boolean(prodCheckboxEl.checked) });
        });
        skipBtn.addEventListener('click', () => {
          bridge.continueWithoutBackend?.();
        });
      }
    </script>
  </body>
</html>
