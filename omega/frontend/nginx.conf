map $arg_state $google_callback_file {
    "~^D_[A-Za-z0-9_-]{41}$" /google-desktop-return.html;
    default /index.html;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 130M;

    location = /actuator/health {
        proxy_pass http://backend-java:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host backend-java:8080;
    }

    location /api/ {
        proxy_pass http://backend-java:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host backend-java:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /google/callback {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $google_callback_file =404;
    }

    location = /google-desktop-return.html {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location ~ ^/github/(setup|callback)$ {
        access_log off;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
