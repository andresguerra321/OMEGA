<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Acceso con Google · OMEGA Security</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding-block: 16px;
      color-scheme: dark;
      background: #05070B;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 560px 445px at calc(50% + 260px) calc(50% - 235px),
        transparent 55%, #1D4ED8 68%, #2F6FED 70%, #1D4ED8 72%, transparent 80%);
      filter: blur(14px);
      opacity: .22;
    }
    .card {
      position: relative;
      width: calc(100% - 32px);
      max-width: 400px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 20px;
      background: rgba(11, 16, 27, .72);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 24px 60px rgba(0, 0, 0, .6);
      text-align: center;
      animation: arrive 450ms cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    .mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 22px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: radial-gradient(ellipse at 50% 110%, rgba(47, 111, 237, .28), transparent 72%), #0F131B;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .13);
    }
    .badge {
      display: none;
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 20px;
      height: 20px;
      place-items: center;
      background: #0B101B;
      border: 1px solid currentColor;
      border-radius: 50%;
    }
    [data-state="success"] .badge-success { display: grid; color: #10B981; }
    [data-state="error"] .badge-error { display: grid; color: #EF4444; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
    .message { margin: 10px 0 22px; color: #94A3B8; font-size: 13.5px; line-height: 1.55; }
    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #2F6FED;
      color: #FFFFFF;
      font: 500 13.5px system-ui, -apple-system, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button:focus-visible { outline: 2px solid #F8FAFC; outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: wait; }
    .note { margin: 12px 0 0; color: #64748B; font-size: 11.5px; line-height: 1.5; }
    footer {
      margin-top: 23px;
      padding-top: 17px;
      border-top: 1px solid rgba(255, 255, 255, .06);
      color: rgba(148, 163, 184, .6);
      font: 11px/1.5 ui-monospace, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main class="card" data-state="pending" aria-labelledby="title">
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F8FAFC" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 18.5H9.2V16.2C7.4 14.9 6.3 12.9 6.3 10.6C6.3 7.3 8.85 4.8 12 4.8C15.15 4.8 17.7 7.3 17.7 10.6C17.7 12.9 16.6 14.9 14.8 16.2V18.5H19"/>
      </svg>
      <span class="badge badge-success"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></span>
      <span class="badge badge-error"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v8m0 5h.01"/></svg></span>
    </div>
    <h1 id="title">Acceso con Google</h1>
    <p class="message" id="message" role="status">Comunicando el resultado a OMEGA Desktop…</p>
    <button id="close" type="button" disabled>Cerrar esta pestaña</button>
    <p class="note" id="note" role="status">Puedes cerrar esta ventana de forma segura.</p>
    <footer>OMEGA Security · Conexión verificada</footer>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const state = params.get('state');
    const canceled = params.has('error');
    const code = canceled ? null : params.get('code');
    const card = document.querySelector('.card');
    const title = document.querySelector('#title');
    const message = document.querySelector('#message');
    const close = document.querySelector('#close');

    history.replaceState(null, '', '/google-desktop-return.html');
    close.addEventListener('click', () => {
      window.close();
      document.querySelector('#note').textContent = 'También puedes cerrar la pestaña desde tu navegador y volver a OMEGA Desktop.';
    });

    function showResult(success) {
      card.dataset.state = success ? 'success' : 'error';
      title.textContent = success ? 'Autenticación completada' : 'No se pudo completar el acceso';
      message.textContent = success
        ? 'Tu autorización de Google se envió correctamente. Ya puedes volver a OMEGA Desktop.'
        : 'El inicio de sesión con Google fue cancelado o expiró. Inténtalo nuevamente desde OMEGA Desktop.';
      close.disabled = false;
    }

    async function returnToDesktop() {
      if (!/^D_[A-Za-z0-9_-]{41}$/.test(state || '') || (!canceled && (!code || code.length > 2048))) {
        showResult(false);
        return;
      }
      if (canceled) showResult(false);
      const csrf = await fetch('/api/v1/auth/csrf', { cache: 'no-store' });
      if (!csrf.ok) throw new Error();
      const protection = await csrf.json();
      if (!protection.token || protection.headerName !== 'X-XSRF-TOKEN') throw new Error();
      const relay = await fetch('/api/v1/auth/google/desktop/relay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': protection.token },
        body: JSON.stringify({ state, code }),
      });
      if (relay.status !== 204) throw new Error();
      showResult(!canceled);
    }

    returnToDesktop().catch(() => showResult(false));
  </script>
</body>
</html>
