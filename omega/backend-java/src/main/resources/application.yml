spring:
  application:
    name: omega-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omega_cti?currentSchema=omega_rag,public}
    username: ${POSTGRES_USER:omega_admin}
    password: ${POSTGRES_PASSWORD:omega_dev_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-init-sql: SET search_path TO omega_rag, public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: omega_rag
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: omega_rag
    default-schema: omega_rag
    create-schemas: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${OMEGA_MAX_UPLOAD_SIZE:64MB}
      max-request-size: ${OMEGA_MAX_REQUEST_SIZE:128MB}
  mail:
    host: ${OMEGA_SMTP_HOST:}
    port: ${OMEGA_SMTP_PORT:587}
    username: ${OMEGA_SMTP_USERNAME:}
    password: ${OMEGA_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${OMEGA_SMTP_AUTH:true}
          starttls:
            enable: ${OMEGA_SMTP_STARTTLS:true}
            required: ${OMEGA_SMTP_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

omega:
  ai:
    provider: ${OMEGA_AI_PROVIDER:openai}
    ollama:
      base-url: ${OMEGA_OLLAMA_BASE_URL:http://localhost:11434}
      embed-model: ${OMEGA_OLLAMA_EMBED_MODEL:bge-m3}
      chat-model: ${OMEGA_OLLAMA_CHAT_MODEL:qwen2.5:14b}
      vision-model: ${OMEGA_OLLAMA_VISION_MODEL:qwen2.5vl:7b}
  security:
    jwt-secret: ${OMEGA_JWT_SECRET:${JWT_SECRET:omega-dev-local-only-hmac-sha256-secret-key-2026-change-in-prod}}
    jwt-expiration-seconds: ${OMEGA_JWT_EXPIRATION_SECONDS:604800}
    jwt-issuer: omega-rag-core
    allow-tenant-self-registration: ${OMEGA_ALLOW_TENANT_SELF_REGISTRATION:true}
    bootstrap-secret: ${OMEGA_BOOTSTRAP_SECRET:}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:omega-dev-internal-service-token-change-in-prod}
    session-cookie-name: ${OMEGA_SESSION_COOKIE_NAME:omega_session}
    session-cookie-secure: ${OMEGA_COOKIE_SECURE:false}
    cors-allowed-origins: ${OMEGA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,http://tauri.localhost,https://tauri.localhost,tauri://localhost}
  ingest:
    temp-dir: ${OMEGA_INGEST_TMP_DIR:/tmp/omega_ingest}
    max-pdf-bytes: ${OMEGA_MAX_PDF_BYTES:26214400}
    tesseract-data-path: ${TESSDATA_PREFIX:/usr/share/tesseract-ocr/4.00/tessdata}
    max-image-bytes: ${OMEGA_MAX_IMAGE_BYTES:8388608}
    max-image-dimension: ${OMEGA_MAX_IMAGE_DIMENSION:4096}
  rag:
    embedding-provider: ${OMEGA_EMBEDDING_PROVIDER:openai}
    embedding-model: ${OMEGA_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${OMEGA_EMBEDDING_DIMENSIONS:1536}
    open-ai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    open-ai-api-key: ${OPENAI_API_KEY:}
    open-ai-batch-size: ${OPENAI_BATCH_SIZE:32}
    open-ai-max-retries: ${OPENAI_MAX_RETRIES:2}
    chat-model: ${OMEGA_CHAT_MODEL:gpt-4o-mini}
    groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:openai/gpt-oss-120b}
    omni-route-base-url: ${OMNIROUTE_BASE_URL:}
    omni-route-api-key: ${OMNIROUTE_API_KEY:}
    omni-route-model: ${OMNIROUTE_MODEL:auto}
    custom-chat-provider: ${CUSTOM_LLM_PROVIDER:}
    custom-chat-base-url: ${CUSTOM_LLM_BASE_URL:}
    custom-chat-api-key: ${CUSTOM_LLM_API_KEY:}
    custom-chat-model: ${CUSTOM_LLM_MODEL:}
    rrf-k: 60
    vector-weight: 1.0
    lexical-weight: 1.0
    min-chunk-tokens: 500
    max-chunk-tokens: 1000
    chunk-overlap-tokens: 120
  forensic-worker:
    base-url: ${OMEGA_FORENSIC_WORKER_URL:http://forensic-worker:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
  cti:
    stix-corpus-dir: ${OMEGA_STIX_CORPUS_DIR:/app/corpus_mvp/iocs}
