server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: omega_rag
    default-schema: omega_rag
    create-schemas: true

omega:
  security:
    jwt-secret: omega-integration-test-hmac-sha256-secret-key-min-32-bytes
    jwt-expiration-seconds: 3600
    jwt-issuer: omega-rag-core
    allow-tenant-self-registration: true
    bootstrap-secret: ""
    internal-service-token: omega-test-internal-service-token
  ingest:
    temp-dir: ${java.io.tmpdir}/omega_ingest_test
    max-pdf-bytes: 26214400
    tesseract-data-path: /usr/share/tesseract-ocr/4.00/tessdata
  rag:
    embedding-provider: openai
    embedding-model: text-embedding-3-small
    embedding-dimensions: 1536
    open-ai-base-url: https://api.openai.com/v1
    open-ai-api-key: ""
    open-ai-batch-size: 16
    open-ai-max-retries: 1
    chat-model: gpt-4o-mini
    rrf-k: 60
    vector-weight: 1.0
    lexical-weight: 1.0
    min-chunk-tokens: 500
    max-chunk-tokens: 1000
    chunk-overlap-tokens: 120
  forensic-worker:
    base-url: http://localhost:18000
    connect-timeout-ms: 1000
    read-timeout-ms: 5000
  cti:
    stix-corpus-dir: ../corpus_mvp/iocs
